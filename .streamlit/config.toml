[theme]
# Tema base: puede ser "light" o "dark"
base = "light"

# Color principal (botones, sliders, elementos interactivos). Azul del logo
primaryColor = "#1F6FB5"

# Color de fondo de la app
backgroundColor = "#F4F7FB"

# Color de fondo secundario (barra lateral, widgets, tablas). Azul muy clarito
secondaryBackgroundColor = "#EAF1F9"

# Color del texto principal. Azul marino del logo
textColor = "#0D2B4E"

# Fuente de texto
font = "sans serif"
